<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="leafGrad" x1="16" y1="112" x2="112" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="harvestGrad" x1="32" y1="96" x2="112" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>
    <radialGradient id="satelliteGlow" cx="64" cy="64" r="56" gradientUnits="userSpaceOnUse">
      <stop offset="60%" stop-color="#10B981" stop-opacity="0" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.2" />
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#064E3B" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background Glow & Satellite Waves -->
  <circle cx="64" cy="64" r="58" fill="url(#satelliteGlow)" />
  <circle cx="64" cy="64" r="54" stroke="#10B981" stroke-width="2" stroke-dasharray="4 6" opacity="0.35" />
  <circle cx="64" cy="64" r="42" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3 5" opacity="0.4" />

  <!-- Main Agro Stem & Leaves (Clean Stylized Wheat/Sprout) -->
  <g filter="url(#softShadow)">
    <!-- Central curved growth stem -->
    <path d="M40 106 C 52 92, 60 74, 64 34" stroke="url(#leafGrad)" stroke-width="7" stroke-linecap="round" />
    
    <!-- Left Green Leaf (SMAP/Soil) -->
    <path d="M57 78 C 36 78, 24 64, 26 48 C 42 46, 56 60, 58 76 Z" fill="url(#leafGrad)" />
    
    <!-- Right Golden Wheat Grain (Harvest) -->
    <path d="M63 60 C 82 56, 94 40, 90 26 C 74 26, 62 42, 62 58 Z" fill="url(#harvestGrad)" />
    
    <!-- Secondary Golden Grain -->
    <path d="M60 84 C 78 80, 88 66, 86 52 C 72 54, 60 68, 60 82 Z" fill="url(#harvestGrad)" />

    <!-- Top Sprout Peak -->
    <path d="M64 34 C 64 20, 72 14, 76 12 C 76 22, 70 30, 64 34 Z" fill="url(#harvestGrad)" />
  </g>

  <!-- AI Nexus Tech Nodes (Satellite Intelligence Connectivity) -->
  <circle cx="76" cy="12" r="3.5" fill="#F59E0B" />
  <circle cx="26" cy="48" r="3.5" fill="#10B981" />
  <circle cx="90" cy="26" r="3" fill="#EA580C" />
  <circle cx="86" cy="52" r="3" fill="#F59E0B" />
  
  <!-- Orbital Signal Dot -->
  <circle cx="106" cy="64" r="4" fill="#0284C7" />
  <circle cx="106" cy="64" r="7" stroke="#0284C7" stroke-width="1.5" opacity="0.5" />
</svg>

